# ==========================================
# 1. CONEXAO COM O BANCO DE DADOS (POSTGRESQL)
# ==========================================
spring.profiles.active=local

spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ==========================================
# 2. GOOGLE OAUTH2
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

# ==========================================
# 3. JWT
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ==========================================
# 4. EMAIL
# ==========================================
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.email.from=${EMAIL_FROM:noreply@syra.com.br}
app.email.admin=${EMAIL_ADMIN:admin@syra.com.br}

# ==========================================
# 5. SERVIDOR
# ==========================================
server.port=${PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:}
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
server.error.include-binding-errors=always

# ==========================================
# 6. CORS
# ==========================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ==========================================
# 7. LOGGING
# ==========================================
logging.level.root=INFO
logging.level.com.syra=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==========================================
# 8. JACKSON
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=America/Fortaleza

# ==========================================
# 9.5 GOOGLE CALENDAR (AGENDAMENTOS)
# ==========================================
app.google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
app.google.calendar.calendar-id=${GOOGLE_CALENDAR_ID:}
app.google.calendar.credentials-base64=${GOOGLE_CALENDAR_SA_JSON_BASE64:}
app.google.calendar.time-zone=${GOOGLE_CALENDAR_TIME_ZONE:America/Fortaleza}
app.google.calendar.owner-email=${GOOGLE_CALENDAR_OWNER_EMAIL:}
app.google.calendar.send-updates=${GOOGLE_CALENDAR_SEND_UPDATES:all}

# ==========================================
# 9. ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# ==========================================
# 10. CLOUDINARY (IMAGENS)
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
# ==========================================
# 11. TAMANHO  (IMAGENS)
# ==========================================
spring.servlet.multipart.max-file-size=10MB
# Define max total request size (can include multiple files)
spring.servlet.multipart.max-request-size=10MB